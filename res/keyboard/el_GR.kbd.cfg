[AccessMenu]
// Issue #57: always-available chords for the spoken [AccessMenu] popup menu,
// previously reachable only via the DDJ-400 browse-knob hold gesture. These
// are wired as application-wide Qt shortcuts in MixxxMainWindow rather than
// through the normal kbd.cfg -> ControlObject path, so they keep working
// even when "Enable Keyboard Shortcuts" (further up this file) is turned
// off -- otherwise a keyboard-only DJ who disables shortcuts from this same
// menu would have no way back in. The key sequences below are only the
// *defaults* read at startup to build those shortcuts; rebinding them here
// changes the key like any other entry.
toggle Alt+Shift+M
navigateUp Alt+Shift+Up
navigateDown Alt+Shift+Down
activate Alt+Shift+Return
back Alt+Shift+Backspace
confirm Alt+Shift+Space
