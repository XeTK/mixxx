# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# DEV-ONLY: verify whether a console-allocating launcher (withconsole.exe)
# can give wix.exe a real console in the runner's context, which is the
# suspected fix for the persistent WIX0001 "pipe is being closed" failure.
# withconsole.exe is pre-built on the runner at C:\gitea-runner\withconsole.exe.

name: Test Windows Console (dev)

on:
  workflow_dispatch:

concurrency:
  group: build-windows-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-console:
    name: Windows console check
    runs-on: windows
    steps:
      - name: "Check for console"
        shell: pwsh
        run: |
          $src = 'using System; using System.Runtime.InteropServices; public class C { [DllImport("kernel32.dll")] public static extern IntPtr GetConsoleWindow(); }'
          Add-Type -TypeDefinition $src
          $hwnd = [C]::GetConsoleWindow()
          Write-Host "step GetConsoleWindow: $hwnd"

      - name: "Run withconsole.exe wrapper"
        shell: pwsh
        run: |
          $src = 'using System; using System.Runtime.InteropServices; public class P { [DllImport("kernel32.dll")] public static extern IntPtr GetConsoleWindow(); }'
          Write-Host "=== bare pwsh child ==="
          & pwsh -NoProfile -Command "Add-Type -TypeDefinition '$src'; Write-Host ('bare child console: ' + [P]::GetConsoleWindow())"
          Write-Host "=== wrapped in withconsole.exe ==="
          & C:\gitea-runner\withconsole.exe pwsh -NoProfile -Command "Add-Type -TypeDefinition '$src'; Write-Host ('wrapped child console: ' + [P]::GetConsoleWindow())"
