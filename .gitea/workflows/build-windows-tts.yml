# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# DEV-ONLY: fast iteration on the Windows TTS integration tests without
# running the full ~30 min build/test/package pipeline. Reuses the sccache
# cache from the main build-windows.yml runs, builds only the mixxx-test
# target, and loops the TtsEngineIntegrationTest suite to shake out the
# intermittent "no audio produced" flakiness.
#
# Trigger manually: Actions -> "Test Windows TTS (dev)" -> Run workflow.
# Optional input `iterations` controls how many times the suite is repeated.

name: Test Windows TTS (dev)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to repeat the TTS test suite"
        required: false
        default: "5"

concurrency:
  group: build-windows-tts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows-tts:
    name: Windows TTS loop
    runs-on: windows
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        shell: pwsh
        run: git fetch origin --force --tags

      - name: "Set up cmake"
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-x86_64.zip -OutFile cmake-x64.zip
          Expand-Archive cmake-x64.zip -DestinationPath C:\gitea-runner\cmake -Force
          $cmakePath = "C:\gitea-runner\cmake\cmake-3.30.1-windows-x86_64\bin"
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$cmakePath"
          cmake --version

      - name: "Set up MSVC Developer Command Prompt"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Set up build environment"
        shell: cmd
        run: tools/windows_buildenv.bat setup
        env:
          BUILDENV_RELEASE: TRUE

      - name: "Set up sccache"
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-pc-windows-msvc.zip -OutFile sccache.zip
          Expand-Archive sccache.zip -DestinationPath C:\gitea-runner\sccache -Force
          $sccachePath = "C:\gitea-runner\sccache\sccache-v0.17.0-x86_64-pc-windows-msvc"
          $sccachePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$sccachePath"
          sccache --version

      - name: "Restore sccache cache"
        uses: actions/cache/restore@v4
        with:
          path: C:\gitea-runner\sccache-dir
          key: sccache-windows-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            sccache-windows-${{ github.ref_name }}
            sccache-windows-

      - name: "Configure"
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DVCPKG_TARGET_TRIPLET="${{ env.VCPKG_TARGET_TRIPLET }}"
          -DBULK=ON
          -DHSS1394=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMEDIAFOUNDATION=ON
          -DMODPLUG=ON
          -DQT6=ON
          -DQML=ON
          -DWAVPACK=ON
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=ON
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_TIMEOUT=60
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        env:
          CC: cl
          CXX: cl
          SCCACHE_DIR: C:\gitea-runner\sccache-dir

      - name: "Build mixxx-test only"
        shell: pwsh
        # Only the test binary, not the full app/installer - this is the
        # whole point of the dev loop. With a warm sccache this is fast.
        run: cmake --build build --config RelWithDebInfo --target mixxx-test
        env:
          CC: cl
          CXX: cl
          SCCACHE_DIR: C:\gitea-runner\sccache-dir

      - name: "Save sccache cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\gitea-runner\sccache-dir
          key: sccache-windows-${{ github.ref_name }}-${{ github.run_number }}

      - name: "Loop TTS integration tests"
        shell: pwsh
        env:
          GTEST_COLOR: 1
          CTEST_OUTPUT_ON_FAILURE: 1
        # Repeat the TTS suite N times (default 5) to shake out the
        # intermittent "no non-silent buffer" failure. Each ctest invocation
        # runs the two TtsEngineIntegrationTest cases once; the loop lets us
        # see whether the flakiness is a coin-flip or correlated across runs.
        run: |
          $iterations = [int]${{ github.event.inputs.iterations }}
          if ($iterations -lt 1) { $iterations = 1 }
          $failures = 0
          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "=== TTS iteration $i/$iterations ==="
            ctest --test-dir build -R "^TtsEngineIntegrationTest\..*$" --timeout 45
            if ($LASTEXITCODE -ne 0) {
              $failures++
              Write-Host "Iteration $i FAILED (exit $LASTEXITCODE)"
            }
          }
          Write-Host "=== Done: $failures/$iterations iterations failed ==="
          if ($failures -gt 0) { exit 1 }
