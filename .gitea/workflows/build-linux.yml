# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build Linux

on:
  # Only auto-build on push for the integration branches. Feature branches
  # build via their pull_request instead of also firing on push - previously
  # both fired for every commit, doubling the queue (and ccache seeds from
  # these two branches so PR builds still get warm cache hits).
  push:
    branches: ["main", "accessibility-improvements-2026-06-25"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # The auto-injected GITHUB_TOKEN defaults to read-only on this instance,
  # which silently breaks the "Publish release" step below (its release
  # create/lookup calls fail, and the script's own error handling has a
  # set -e + pipefail gotcha that skips its intended graceful fallback -
  # see the comment on RELEASE_ID). contents: write is what release
  # creation and asset upload need.
  contents: write

jobs:
  build-linux:
    name: Ubuntu Qt6 DEB
    runs-on: linux-x86
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install sudo"
        # The runner's container image runs as root and has no sudo binary,
        # but debian_buildenv.sh shells out to `sudo apt-get ...`.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo

      - name: "Set up build environment"
        run: tools/debian_buildenv.sh setup

      - name: "Sync source to stable path"
        # Gitea's linux-x86 runner gives each job a fresh per-run working dir
        # (/root/.cache/act/<task-hash>/hostexecutor). CMake bakes that absolute
        # path into the -I include flags, which ccache hashes (via #line markers
        # in the preprocessed output), so every run misses -> ~0% hit rate even
        # though save/restore works. Relocating the tree to one fixed path makes
        # -I paths byte-identical across runs, so unchanged code gets ~100% hits.
        run: |
          apt-get install -y --no-install-recommends rsync
          STABLE=/opt/mixxx-ci/src
          mkdir -p "$STABLE"
          # --delete so the stable tree always matches this run's HEAD.
          rsync -a --delete --exclude=.git --exclude=build "$GITHUB_WORKSPACE"/ "$STABLE"/
          echo "STABLE_SRC=$STABLE" >> "$GITHUB_ENV"

      - name: "Install zstd for faster ccache cache transfer"
        # actions/cache shells out to `tar` and picks the fastest compression
        # program it can find on PATH, falling back to gzip if zstd isn't
        # present (see actions/toolkit's getCompressionMethod()). This image
        # doesn't ship zstd, so every restore/save of the ~/.cache/ccache
        # archive has been going through gzip, which is markedly slower to
        # both compress and decompress than zstd for the same payload - this
        # is pure cache-artifact transfer time, on top of and distinct from
        # ccache's own (already fast) object lookup on a hit. Installing zstd
        # lets both the restore step below and the "Save ccache" step later
        # pick it up automatically; nothing else needs to change.
        run: apt-get install -y --no-install-recommends zstd

      - name: "Restore ccache"
        # actions/cache's own post-hook (which saves the cache) never runs on
        # this runner - its save/restore state doesn't propagate from the
        # main to the post phase, so it always misses. Explicit restore/save
        # steps don't depend on that mechanism.
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.ref_name }}
          restore-keys: |
            linux-ccache-${{ github.base_ref }}
            linux-ccache-

      - name: "Configure ccache"
        env:
          # Gitea's linux-x86 runner runs each job in a unique per-run working
          # directory, and the build's -fmacro-prefix-map bakes that path into
          # __FILE__ for the compiler. With ccache's default hash_dir=true the
          # path becomes part of the cache key, so every run misses -> ~0% hit
          # rate. Disable hashing the working dir and relax the sloppiness so
          # cache entries survive across runs on the same branch.
          # The canonical way to disable hashing the working dir. The setting
          # is "hash_dir" (ccache config); the env var is the legacy
          # CCACHE_NOHASHDIR=true (there is no CCACHE_HASHDIR env var).
          CCACHE_NOHASHDIR: true
          CCACHE_SLOPPINESS: file_macro,file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,time_macros
        run: |
          ccache --zero-stats
          # 12G cap + ccache's own compression. 20G was still too big: the
          # save step tars *and* gzips ~/.cache/ccache, so a 16.5G cache spent
          # 73 min in `tar -z` and the job died with "context deadline
          # exceeded". Compressing inside ccache keeps the objects small, so
          # the archive step has little left to do and the tarball no longer
          # needs ~16G of headroom beside the cache on a 63G disk.
          ccache --max-size=12G
          ccache --set-config=compression=true
          # Persist the settings for any process that reads the config file.
          ccache --set-config=hash_dir=false
          ccache --set-config=sloppiness=file_macro,file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,time_macros
          # The build dir path, if the runner now uses a stable one, is in the
          # cache key via file_macro; hash_dir=false removes the working-dir.
          ccache --show-config | grep -E "hash_dir|sloppiness" 

      - name: "Create build directory"
        run: mkdir build

      - name: "Configure"
        # HID is off because the runner's libhidapi-dev (0.13.1) is older
        # than the 0.14.0 Mixxx requires.
        # Build from the stable path so -I include paths are identical across
        # runs -> ccache hits instead of misses (see "Sync source to stable path").
        run: |
          cd "${STABLE_SRC}"
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT6=ON \
            -DQML=ON \
            -DBULK=ON \
            -DFFMPEG=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DDOWNLOAD_MANUAL=ON \
            -DHID=OFF \
            -DKEYFINDER=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            ..

      - name: "Build"
        # Half of nproc, not nproc: this LXC container has more CPUs than RAM
        # to match, and full parallelism during compilation leaves little
        # headroom afterwards, which lines up with a cluster of test failures
        # (std::bad_alloc) right after Build in earlier runs.
        run: |
          cd "${STABLE_SRC}/build"
          JOBS=$(( $(nproc) / 2 ))
          [ "$JOBS" -lt 1 ] && JOBS=1
          cmake --build . --config RelWithDebInfo -- -j"$JOBS"

      - name: "Print ccache stats"
        # -v breaks "Hits" down into direct vs. preprocessed mode and lists
        # cache-miss reasons. Plain --show-stats collapses all of that into a
        # single hit percentage, which is enough to know a run got cache
        # hits but not enough to tell whether they came from the fast direct-
        # mode path or the slower preprocessor-mode fallback - exactly the
        # "is this actually configured efficiently" question issue #103
        # needs profiling data for.
        run: |
          ccache --show-stats -v
          ccache --cleanup

      - name: "Save ccache"
        # Runs even if Test/Package fail below so a red build still speeds up
        # the next push -- but only on push/dispatch, never on pull_request.
        # Archiving the cache costs many minutes; doing it on every PR run is
        # what blew the job deadline. PRs still *restore* the cache, they just
        # do not re-upload it; integration-branch pushes keep it fresh.
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          # Stable key (branch only, no run_number) so each run overwrites the
          # same entry and the next run's restore gets an exact hit instead of
          # falling back. Avoids accumulating a new cache per run and makes
          # rebuilds near-instant.
          key: linux-ccache-${{ github.ref_name }}

      - name: "Test"
        env:
          GTEST_COLOR: 1
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
        # --repeat until-pass tolerates occasional transient std::bad_alloc
        # failures on this runner's memory-constrained LXC container;
        # --stop-on-failure still stops the whole suite as soon as a test
        # exhausts its retries, instead of grinding through ~1400 more tests.
        run: |
          cd "${STABLE_SRC}/build"
          ctest --timeout 45 --repeat until-pass:3 --stop-on-failure

      - name: "Package"
        run: |
          cd "${STABLE_SRC}/build"
          cpack -G DEB -V

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-linux-deb
          path: ${{ env.STABLE_SRC }}/build/*.deb

      - name: "Publish release"
        # Create (or update) a Gitea release for this build and attach the
        # .deb. The Pi's updater polls the releases API for new versions.
        # Uses the GITHUB_TOKEN Gitea injects for the runner.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitea.xetk.co.uk/api/v1/repos/${GITHUB_REPOSITORY}"
          # Version the release with git describe (e.g. accessibility-beta-2026-07-07-75-g4e5adcb893)
          # so each build gets a unique, sortable tag.
          TAG="$(git describe --tags --always 2>/dev/null || echo ci-build)"
          # Cap the tag length. git describe chains the previous tag + a
          # -N-g<sha> segment per merge, so the name grows unboundedly and
          # eventually exceeds Windows' 260-char MAX_PATH when git materializes
          # refs/tags/<name>.lock during `git fetch --tags` on the Windows
          # runner ("Filename too long"). Keep the leading tag and the trailing
          # short sha so the name stays unique/informative but bounded.
          TAG_MAX=60
          if [ "${#TAG}" -gt "$TAG_MAX" ]; then
            TAG="${TAG:0:40}...${TAG: -10}"
          fi
          # Create the release if it doesn't exist; ignore "already exists". Capture
          # the release ID from the response so we can upload assets to it.
          # Gitea's /releases/latest/assets endpoint 404s, so we must target the
          # release by ID (upload_url) instead.
          CREATE_RESP="$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Mixxx ${TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"draft\":false,\"prerelease\":false}" \
            "${API}/releases" 2>/dev/null || true)"
          # If creation failed (e.g. release already exists), look it up by tag.
          if [ -z "$CREATE_RESP" ] || ! echo "$CREATE_RESP" | grep -q '"id"'; then
            CREATE_RESP="$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/releases/tags/${TAG}" 2>/dev/null || true)"
          fi
          # `|| true` matters here: under `set -e` + `pipefail`, a CREATE_RESP
          # with no "id" (e.g. the release calls above failed) makes grep
          # exit 1, which would otherwise kill the script on this line and
          # skip the graceful "-z "$RELEASE_ID"" fallback below entirely.
          RELEASE_ID="$(printf '%s' "$CREATE_RESP" | grep -oE '"id":[0-9]+' | head -n1 | cut -d: -f2 || true)"
          if [ -z "$RELEASE_ID" ]; then
            echo "WARN: could not determine release ID for ${TAG}"
            exit 0
          fi
          # Upload the .deb as a release asset (idempotent-ish; overwrite if present).
          for deb in build/*.deb; do
            [ -f "$deb" ] || continue
            curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -F "attachment=@${deb}" \
              "${API}/releases/${RELEASE_ID}/assets" || echo "WARN: asset upload failed for ${deb}"
          done

  build-linux-arm64:
    name: Debian arm64 DEB
    # Runs on the dedicated arm64 runner (LXC container on the Proxmox host,
    # registered with the "linux-arm" label). Produces the .deb the Pi installs.
    runs-on: linux-arm
    # The emulated arm64 build is ~5-10x slower than native. Override the
    # runner's default 3h job timeout so the first (no-ccache) build can
    # finish; later runs hit ccache and are much faster.
    timeout-minutes: 360
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install sudo"
        # The runner's container image runs as root and has no sudo binary,
        # but debian_buildenv.sh shells out to `sudo apt-get ...`.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo

      - name: "Set up build environment"
        run: tools/debian_buildenv.sh setup

      - name: "Sync source to stable path"
        # Same as the x86 job: the arm64 runner also gives each job a fresh
        # per-run working dir (/root/.cache/act/<task-hash>/hostexecutor) whose
        # absolute path CMake bakes into -I flags. ccache hashes that via
        # #line markers so every run misses. Relocating to a fixed path makes
        # -I paths byte-identical across runs -> ~100% hits for unchanged code.
        run: |
          apt-get install -y --no-install-recommends rsync
          STABLE=/opt/mixxx-ci-arm64/src
          mkdir -p "$STABLE"
          # --delete so the stable tree always matches this run's HEAD.
          rsync -a --delete --exclude=.git --exclude=build "$GITHUB_WORKSPACE"/ "$STABLE"/
          echo "STABLE_SRC=$STABLE" >> "$GITHUB_ENV"

      - name: "Install zstd for faster ccache cache transfer"
        # See the x86 job's equivalent step: this image has no zstd, so
        # actions/cache falls back to gzip for the tar archive it
        # restores/saves, which is slower than zstd for the same payload -
        # independent of and on top of ccache's own per-object lookup speed.
        run: apt-get install -y --no-install-recommends zstd

      - name: "Restore ccache"
        # Same explicit restore/save approach as the x86 job - the runner's
        # actions/cache post-hook doesn't propagate state, so we restore and
        # save explicitly. This is critical on the emulated arm64 runner:
        # without it every push recompiles the whole tree from scratch under
        # qemu, which blows past the job timeout.
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-arm-ccache-${{ github.ref_name }}
          restore-keys: |
            linux-arm-ccache-${{ github.base_ref }}
            linux-arm-ccache-

      - name: "Configure ccache"
        env:
          # The canonical way to disable hashing the working dir. The setting
          # is "hash_dir" (ccache config); the env var is the legacy
          # CCACHE_NOHASHDIR=true (there is no CCACHE_HASHDIR env var).
          CCACHE_NOHASHDIR: true
          CCACHE_SLOPPINESS: file_macro,file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,time_macros
        run: |
          ccache --zero-stats
          # Same 12G + compression as the x86 job. The emulated arm64 build
          # is slow so we want a lot cached, but an uncompressed 20G cache
          # cannot be archived inside the job deadline -- compression buys
          # back most of the effective capacity at a fraction of the size.
          ccache --max-size=12G
          ccache --set-config=compression=true
          # Persist for any process reading the config file, and to survive
          # the per-run working dir in the ccache key (see the x86 job).
          ccache --set-config=hash_dir=false
          ccache --set-config=sloppiness=file_macro,file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,time_macros
          ccache --show-config | grep -E "hash_dir|sloppiness" 

      - name: "Create build directory"
        run: mkdir build

      - name: "Configure"
        # Build from the stable path so -I include paths are identical across
        # runs -> ccache hits (see "Sync source to stable path").
        run: |
          cd "${STABLE_SRC}"
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT6=ON \
            -DQML=ON \
            -DBULK=ON \
            -DFFMPEG=ON \
            -DLOCALECOMPARE=ON \
            -DMAD=ON \
            -DMODPLUG=ON \
            -DWAVPACK=ON \
            -DBATTERY=ON \
            -DBROADCAST=ON \
            -DDOWNLOAD_MANUAL=ON \
            -DHID=OFF \
            -DKEYFINDER=ON \
            -DLILV=ON \
            -DOPUS=ON \
            -DQTKEYCHAIN=ON \
            -DVINYLCONTROL=ON \
            -DINSTALL_USER_UDEV_RULES=OFF \
            ..

      - name: "Build"
        # The emulated arm64 build is ~5-10x slower than native, so give it a
        # generous timeout. The first run compiles everything from scratch;
        # subsequent runs hit ccache and are much faster.
        timeout-minutes: 360
        run: |
          cd "${STABLE_SRC}/build"
          JOBS=$(( $(nproc) / 2 ))
          [ "$JOBS" -lt 1 ] && JOBS=1
          cmake --build . --config RelWithDebInfo -- -j"$JOBS"

      - name: "Print ccache stats"
        # -v breaks "Hits" down into direct vs. preprocessed mode and lists
        # cache-miss reasons. Plain --show-stats collapses all of that into a
        # single hit percentage, which is enough to know a run got cache
        # hits but not enough to tell whether they came from the fast direct-
        # mode path or the slower preprocessor-mode fallback - exactly the
        # "is this actually configured efficiently" question issue #103
        # needs profiling data for.
        run: |
          ccache --show-stats -v
          ccache --cleanup

      - name: "Save ccache"
        # Save only on push/dispatch, not pull_request -- see the x86 job.
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          # Stable key (branch only, no run_number) so each run overwrites the
          # same entry and the next run's restore gets an exact hit instead of
          # falling back. Avoids accumulating a new cache per run and makes
          # rebuilds near-instant.
          key: linux-arm-ccache-${{ github.ref_name }}

      - name: "Package"
        run: |
          cd "${STABLE_SRC}/build"
          cpack -G DEB -V

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-linux-deb-arm64
          path: ${{ env.STABLE_SRC }}/build/*.deb

      - name: "Publish release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitea.xetk.co.uk/api/v1/repos/${GITHUB_REPOSITORY}"
          TAG="$(git describe --tags --always 2>/dev/null || echo ci-build)"
          # Cap the tag length (see the x86 job): exceeds Windows MAX_PATH on
          # `git fetch --tags` otherwise.
          TAG_MAX=60
          if [ "${#TAG}" -gt "$TAG_MAX" ]; then
            TAG="${TAG:0:40}...${TAG: -10}"
          fi
          # Create the release if it doesn't exist; ignore "already exists". Capture
          # the release ID so we can upload assets to it (Gitea's
          # /releases/latest/assets endpoint 404s, so target by ID instead).
          CREATE_RESP="$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Mixxx ${TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"draft\":false,\"prerelease\":false}" \
            "${API}/releases" 2>/dev/null || true)"
          # If creation failed (e.g. release already exists), look it up by tag.
          if [ -z "$CREATE_RESP" ] || ! echo "$CREATE_RESP" | grep -q '"id"'; then
            CREATE_RESP="$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
              "${API}/releases/tags/${TAG}" 2>/dev/null || true)"
          fi
          # `|| true` matters here: under `set -e` + `pipefail`, a CREATE_RESP
          # with no "id" (e.g. the release calls above failed) makes grep
          # exit 1, which would otherwise kill the script on this line and
          # skip the graceful "-z "$RELEASE_ID"" fallback below entirely.
          RELEASE_ID="$(printf '%s' "$CREATE_RESP" | grep -oE '"id":[0-9]+' | head -n1 | cut -d: -f2 || true)"
          if [ -z "$RELEASE_ID" ]; then
            echo "WARN: could not determine release ID for ${TAG}"
            exit 0
          fi
          for deb in build/*.deb; do
            [ -f "$deb" ] || continue
            curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -F "attachment=@${deb}" \
              "${API}/releases/${RELEASE_ID}/assets" || echo "WARN: asset upload failed for ${deb}"
          done
