# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Ubuntu Qt6 DEB
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Install sudo"
        # The runner's container image runs as root and has no sudo binary,
        # but debian_buildenv.sh shells out to `sudo apt-get ...`.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo

      - name: "Set up build environment"
        run: tools/debian_buildenv.sh setup

      - name: "Restore ccache"
        # actions/cache's own post-hook (which saves the cache) never runs on
        # this runner - its save/restore state doesn't propagate from the
        # main to the post phase, so it always misses. Explicit restore/save
        # steps don't depend on that mechanism.
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            linux-ccache-${{ github.ref_name }}
            linux-ccache-

      - name: "Configure ccache"
        run: |
          ccache --zero-stats
          ccache --max-size=5G

      - name: "Create build directory"
        run: mkdir build

      - name: "Configure"
        # HID is off because the runner's libhidapi-dev (0.13.1) is older
        # than the 0.14.0 Mixxx requires.
        working-directory: build
        run: >-
          cmake
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DQT6=ON
          -DQML=ON
          -DBULK=ON
          -DFFMPEG=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMODPLUG=ON
          -DWAVPACK=ON
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=ON
          -DHID=OFF
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          -DINSTALL_USER_UDEV_RULES=OFF
          ..

      - name: "Build"
        working-directory: build
        run: cmake --build . --config RelWithDebInfo -- -j"$(nproc)"

      - name: "Print ccache stats"
        run: |
          ccache --show-stats
          ccache --cleanup

      - name: "Save ccache"
        # Runs unconditionally (even if Test/Package fail below) so a red
        # build still speeds up the next push.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.ref_name }}-${{ github.run_number }}

      - name: "Test"
        working-directory: build
        env:
          GTEST_COLOR: 1
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
        # --repeat until-pass tolerates occasional transient std::bad_alloc
        # failures on this runner's memory-constrained LXC container.
        run: ctest --timeout 45 --repeat until-pass:3

      - name: "Package"
        working-directory: build
        run: cpack -G DEB -V

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-linux-deb
          path: build/*.deb
