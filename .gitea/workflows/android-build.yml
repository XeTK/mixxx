name: Build Android APK (manual)

# Manual-only Qt6/CMake cross-compile of Mixxx for Android, following the
# same job shape as upstream mixxxdj/mixxx's "Android 15 arm64" CI matrix
# entry (.github/workflows/build.yml), adapted for our self-hosted Gitea
# Actions runner the way whatcha-say/.gitea/workflows/android-fdroid.yml
# adapts its own Android job:
#   - runs-on: android (the same registered runner label whatcha-say uses)
#   - inline git clone instead of actions/checkout (no `node` in PATH on
#     this host-type runner)
#   - everything else is upstream's own tooling: tools/android_buildenv.sh
#     (ported from upstream, downloads the official prebuilt vcpkg
#     arm64-android dependency bundle from downloads.mixxx.org and
#     provisions JDK/SDK/NDK idempotently) and Qt's own Android APK signing
#     via QT_ANDROID_KEYSTORE_* env vars (no separate apksigner step needed,
#     unlike whatcha-say's plain-Gradle app).
#
# workflow_dispatch only, deliberately — this is a first pass to prove the
# cross-compile boots at all. No push trigger, no F-Droid publish step yet:
# those come after this is proven and after a real signing-key decision is
# made (see ANDROID_SIGNING_KEYSTORE_BASE64 below).
#
# Without ANDROID_SIGNING_KEYSTORE_BASE64/ANDROID_SIGNING_PASSWORD secrets
# set, this generates a throwaway temporary keystore per run (matches
# upstream's own fork-safe fallback) — good enough to sideload via `adb
# install` for a real-device smoke test, not meant for a permanent F-Droid
# release identity.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build, produce sideloadable APK
    runs-on: android
    env:
      CMAKE_ARGS_EXTRA: ""
    steps:
      - name: Checkout code
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@gitea.xetk.co.uk/xetk/mixxx.git" .
          git log -1 --oneline

      - name: "Free up disk space (stale workdirs from previous runs)"
        run: |
          set -eux
          df -h /
          # Each dispatch gets its own /root/.cache/act/<hash>/hostexecutor
          # workdir (10+ GB: vcpkg deps bundle + full C++ object tree) that
          # doesn't appear to get cleaned up automatically between runs.
          # After ~15 dispatches tonight this filled the disk and failed
          # the Gradle APK packaging step with ENOSPC. Remove sibling
          # workdirs untouched for over an hour (leaves anything a
          # concurrently-running job on this shared runner might still be
          # using alone).
          THIS_RUN_DIR="$GITHUB_WORKSPACE"
          PARENT_DIR="$(dirname "$THIS_RUN_DIR")"
          find "$PARENT_DIR" -maxdepth 1 -mindepth 1 -not -path "$THIS_RUN_DIR" -mmin +60 -print -exec rm -rf {} + || true
          df -h /

      - name: "Set up build environment (JDK/SDK/NDK/vcpkg deps)"
        run: |
          set -eux
          chmod +x tools/android_buildenv.sh
          ./tools/android_buildenv.sh setup
        env:
          BUILDENV_BASEPATH: /root/buildenv
          # Matches where this runner's sdkmanager actually installs (see
          # whatcha-say/.gitea/workflows/android-fdroid.yml's ANDROID_HOME on
          # the same runner) - upstream's script defaults to the
          # GitHub-hosted-runner-only /usr/lib/android-sdk otherwise.
          ANDROID_SDK: /opt/android-sdk

      - name: "Setup signing key"
        run: |
          set -eux
          if [ -z "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_SIGNING_KEYSTORE_BASE64 secret set — generating a throwaway temp keystore for this run only."
            keytool \
              -genkey \
              -keystore "$GITHUB_WORKSPACE/mixxx.keystore" \
              -alias mixxx \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -keypass mixxxandroid \
              -storepass mixxxandroid \
              -dname "CN=xetk-mixxx-android-dev"
            {
              echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=mixxxandroid"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=mixxxandroid"
              echo "QT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/mixxx.keystore"
            } >> "$GITHUB_ENV"
          else
            echo "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 -d > "$GITHUB_WORKSPACE/mixxx.keystore"
            {
              echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
              echo "QT_ANDROID_KEYSTORE_KEY_PASS=${ANDROID_SIGNING_PASSWORD}"
              echo "QT_ANDROID_KEYSTORE_STORE_PASS=${ANDROID_SIGNING_PASSWORD}"
              echo "QT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/mixxx.keystore"
            } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

      - name: "Configure"
        run: >-
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_SYSTEM_NAME=Android
          -DVCPKG_TARGET_TRIPLET=arm64-android
          -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release
          -DMIXXX_VCPKG_ROOT="${MIXXX_VCPKG_ROOT}"
          -DBULK=ON
          -DHID=ON
          -DQML=ON
          -DBUILD_TESTING=OFF
          -DBUILD_BENCH=OFF
          -DCMAKE_VERBOSE_MAKEFILE=ON
          -L

      - name: "Build"
        run: cmake --build build --config RelWithDebInfo

      - name: "Locate and upload APK"
        run: |
          set -eux
          APK_PATH=$(find build -iname "*.apk" | head -1)
          test -n "$APK_PATH"
          ls -la "$APK_PATH"

          # actions/upload-artifact needs node, which this host-type runner
          # doesn't have (same reason the checkout step above uses a raw git
          # clone instead) - upload as a plain Gitea release asset via curl
          # instead. Draft + a run-numbered tag so these dev builds don't
          # clutter real releases and don't collide across runs.
          API="https://gitea.xetk.co.uk/api/v1/repos/xetk/mixxx"
          TAG="android-dev-build-${GITHUB_RUN_NUMBER}"
          RELEASE_JSON=$(curl -sf -X POST "$API/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Android dev build #${GITHUB_RUN_NUMBER}\",\"draft\":true,\"prerelease\":true}")
          RELEASE_ID=$(echo "$RELEASE_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          curl -sf -X POST "$API/releases/$RELEASE_ID/assets?name=mixxx.apk" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -F "attachment=@${APK_PATH}"
          echo "Uploaded to release $TAG (draft) - download via the gitea releases API or UI."
