# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# Adapted from the "Windows 2022 x64" job in .github/workflows/build.yml,
# dropping codesign/deploy steps that need Azure secrets this fork doesn't
# have. Untested against the newly-registered "windows" runner - requires
# Visual Studio Build Tools (C++ workload) and the .NET SDK already present
# on that machine; neither can be installed by this workflow.

name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Installer
    runs-on: windows
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        shell: pwsh
        run: git fetch origin --force --tags

      - name: "Set up cmake"
        shell: pwsh
        # jwlawson/actions-setup-cmake calls the GitHub API to look up
        # releases, and picks up the GITHUB_TOKEN Gitea injects for its own
        # API - which github.com rejects ("Bad credentials"). Download the
        # release archive directly instead (same approach build.yml already
        # uses for the Windows ARM64 runner). 3.30+ is needed for Wix
        # Toolset >= v4 support, see:
        # https://cmake.org/cmake/help/latest/cpack_gen/wix.html#variable:CPACK_WIX_VERSION
        run: |
          # Invoke-WebRequest's default progress-bar rendering is extremely
          # slow when stdout isn't an interactive console (e.g. captured by
          # a CI runner) - this download takes ~4x longer without this.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-x86_64.zip -OutFile cmake-x64.zip
          # Extract next to the job workspace (C:\gitea-runner\...), NOT
          # $env:USERPROFILE\cmake: this runner's gitea-runner service runs
          # as LocalSystem, whose profile is
          # C:\Windows\System32\config\systemprofile. Executables living
          # under that path intermittently fail to launch when invoked deep
          # in a process chain (ninja -> cmd -> the tool) as SYSTEM - see
          # KNOWN_ISSUES.md. -Force: this is a persistent host-mode runner,
          # not an ephemeral container, so a previous run may have already
          # extracted this.
          Expand-Archive cmake-x64.zip -DestinationPath C:\gitea-runner\cmake -Force
          $cmakePath = "C:\gitea-runner\cmake\cmake-3.30.1-windows-x86_64\bin"
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$cmakePath"
          cmake --version

      - name: "Set up MSVC Developer Command Prompt"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Set up build environment"
        shell: cmd
        # With the cmd shell the ERRORLEVEL is checked.
        run: tools/windows_buildenv.bat setup
        env:
          BUILDENV_RELEASE: TRUE

      - name: "Set up sccache"
        shell: pwsh
        # ccache doesn't support MSVC's cl.exe; sccache does, via
        # CMAKE_<LANG>_COMPILER_LAUNCHER below. Installed to C:\gitea-runner,
        # not $env:USERPROFILE - see the "Set up cmake" step for why.
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-pc-windows-msvc.zip -OutFile sccache.zip
          Expand-Archive sccache.zip -DestinationPath C:\gitea-runner\sccache -Force
          $sccachePath = "C:\gitea-runner\sccache\sccache-v0.17.0-x86_64-pc-windows-msvc"
          $sccachePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$sccachePath"
          sccache --version

      - name: "Restore sccache cache"
        uses: actions/cache/restore@v4
        with:
          path: C:\gitea-runner\sccache-dir
          key: sccache-windows-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            sccache-windows-${{ github.ref_name }}
            sccache-windows-

      - name: "Configure"
        # shell: pwsh - see KNOWN_ISSUES.md for why (Windows PowerShell 5.1
        # isn't installed on this runner at all, so the default shell
        # failed outright; pwsh 7 was installed machine-wide instead).
        #
        # MEDIAFOUNDATION is back on: the Media Feature Pack (missing on
        # this runner's Windows 11 N install) is now present - see
        # KNOWN_ISSUES.md.
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DVCPKG_TARGET_TRIPLET="${{ env.VCPKG_TARGET_TRIPLET }}"
          -DBULK=ON
          -DHSS1394=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMEDIAFOUNDATION=ON
          -DMODPLUG=ON
          -DQT6=ON
          -DQML=ON
          -DWAVPACK=ON
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=ON
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
          -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_TIMEOUT=60
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        env:
          CC: cl
          CXX: cl
          SCCACHE_DIR: C:\gitea-runner\sccache-dir

      - name: "Build"
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo
        env:
          CC: cl
          CXX: cl
          SCCACHE_DIR: C:\gitea-runner\sccache-dir

      - name: "Show sccache stats"
        shell: pwsh
        run: sccache --show-stats
        env:
          SCCACHE_DIR: C:\gitea-runner\sccache-dir

      - name: "Save sccache cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\gitea-runner\sccache-dir
          key: sccache-windows-${{ github.ref_name }}-${{ github.run_number }}

      - name: "Test"
        shell: pwsh
        env:
          GTEST_COLOR: 1
          # Windows tests fail randomly if run in parallel.
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
        # AutoDJProcessorTest is a known-broken suite on Windows (see
        # .github/workflows/build.yml). --repeat until-pass tolerates other
        # occasional transient failures; --stop-on-failure still stops the
        # whole suite once a test exhausts its retries.
        run: >-
          ctest --test-dir build --timeout 45
          --exclude-regex "^AutoDJProcessorTest.*$"
          --repeat until-pass:3
          --stop-on-failure

      - name: "Check for WiX Toolset"
        # windows-runner is a persistent host-mode runner (not an ephemeral
        # container), and `dotnet tool install --global wix` +
        # `wix extension add` were already run once by hand and are on the
        # machine PATH - reinstalling every run just wastes ~10-20s. Fail
        # loudly if that ever stops being true instead of silently
        # reinstalling, so a runner rebuild doesn't go unnoticed.
        shell: pwsh
        run: wix --version

      - name: "Package"
        shell: pwsh
        # -V (verbose): safe now that windows-runner runs gitea-runner as a
        # Scheduled Task bound to the logged-in interactive session rather
        # than a Session-0 Windows service - see KNOWN_ISSUES.md for why
        # that mattered (wix.exe needs a real console, which Session-0
        # services can never get, triggering an upstream WiX bug,
        # wixtoolset/wix#701). The retry loop below is kept as a cheap
        # safety net for unrelated transient failures.
        run: |
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            cpack --config build/CPackConfig.cmake -G WIX -V -B build
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Package attempt $i/$maxAttempts failed (exit $LASTEXITCODE)."
            if ($i -eq $maxAttempts) {
              Get-Content build/_CPack_Packages/win64/WIX/wix.log -ErrorAction SilentlyContinue
              exit $LASTEXITCODE
            }
            Remove-Item -Recurse -Force build/_CPack_Packages -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
          }

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-windows-msi
          path: build/*.msi
