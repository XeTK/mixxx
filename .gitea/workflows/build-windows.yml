# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# Adapted from the "Windows 2022 x64" job in .github/workflows/build.yml,
# dropping codesign/deploy steps that need Azure secrets this fork doesn't
# have. Untested against the newly-registered "windows" runner - requires
# Visual Studio Build Tools (C++ workload) and the .NET SDK already present
# on that machine; neither can be installed by this workflow.

name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Installer
    runs-on: windows
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4
        with:
          # This is necessary for making `git describe` work.
          fetch-depth: 0

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Set up cmake"
        # jwlawson/actions-setup-cmake calls the GitHub API to look up
        # releases, and picks up the GITHUB_TOKEN Gitea injects for its own
        # API - which github.com rejects ("Bad credentials"). Download the
        # release archive directly instead (same approach build.yml already
        # uses for the Windows ARM64 runner). 3.30+ is needed for Wix
        # Toolset >= v4 support, see:
        # https://cmake.org/cmake/help/latest/cpack_gen/wix.html#variable:CPACK_WIX_VERSION
        run: |
          # Invoke-WebRequest's default progress-bar rendering is extremely
          # slow when stdout isn't an interactive console (e.g. captured by
          # a CI runner) - this download takes ~4x longer without this.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v3.30.1/cmake-3.30.1-windows-x86_64.zip -OutFile cmake-x64.zip
          # -Force: this is a persistent host-mode runner, not an ephemeral
          # container, so a previous run may have already extracted this.
          Expand-Archive cmake-x64.zip -DestinationPath $env:USERPROFILE\cmake -Force
          $cmakePath = "$env:USERPROFILE\cmake\cmake-3.30.1-windows-x86_64\bin"
          $cmakePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path += ";$cmakePath"
          cmake --version

      - name: "Set up MSVC Developer Command Prompt"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Set up build environment"
        shell: cmd
        # With the cmd shell the ERRORLEVEL is checked.
        run: tools/windows_buildenv.bat setup
        env:
          BUILDENV_RELEASE: TRUE

      - name: "Configure"
        # Uses -S/-B instead of "mkdir build" + cd/working-directory: on
        # this runner, operating on a directory just created in the same
        # step (even via cd within one process, not just across a step
        # boundary) makes cmake fail claiming the parent doesn't exist,
        # consistently and within about a second. -S/-B never changes the
        # process's own working directory, which sidesteps it entirely.
        # See KNOWN_ISSUES.md.
        #
        # MEDIAFOUNDATION is off because this runner is Windows 11 N, which
        # ships without the Media Foundation platform DLLs (an EU
        # regulatory requirement for N editions) - see KNOWN_ISSUES.md for
        # the real fix (installing the Media Feature Pack), which is
        # currently blocked by an unresolved DISM access-denied error.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}"
          -DVCPKG_TARGET_TRIPLET="${{ env.VCPKG_TARGET_TRIPLET }}"
          -DBULK=ON
          -DHSS1394=ON
          -DLOCALECOMPARE=ON
          -DMAD=ON
          -DMEDIAFOUNDATION=OFF
          -DMODPLUG=ON
          -DQT6=ON
          -DQML=ON
          -DWAVPACK=ON
          -DBATTERY=ON
          -DBROADCAST=ON
          -DDOWNLOAD_MANUAL=ON
          -DHID=ON
          -DKEYFINDER=ON
          -DLILV=ON
          -DOPUS=ON
          -DQTKEYCHAIN=ON
          -DVINYLCONTROL=ON
        env:
          CC: cl
          CXX: cl

      - name: "Build"
        run: cmake --build build --config RelWithDebInfo
        env:
          CC: cl
          CXX: cl

      - name: "Test"
        env:
          GTEST_COLOR: 1
          # Windows tests fail randomly if run in parallel.
          CTEST_PARALLEL_LEVEL: 1
          CTEST_OUTPUT_ON_FAILURE: 1
        # AutoDJProcessorTest is a known-broken suite on Windows (see
        # .github/workflows/build.yml). --repeat until-pass tolerates other
        # occasional transient failures; --stop-on-failure still stops the
        # whole suite once a test exhausts its retries.
        run: >-
          ctest --test-dir build --timeout 45
          --exclude-regex "^AutoDJProcessorTest.*$"
          --repeat until-pass:3
          --stop-on-failure

      - name: "Install WiX Toolset"
        shell: pwsh
        run: |
          dotnet.exe tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2

      - name: "Package"
        run: cpack --config build/CPackConfig.cmake -G WIX -V -B build

      - name: "Upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: mixxx-windows-msi
          path: build/*.msi
